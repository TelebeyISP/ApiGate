version: '3.9'

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  sylius_db_data:
    driver: local
  redis_data:
    driver: local
  sylius_media:
    driver: local
  sylius_jwt:
    driver: local

# ─── Network ───────────────────────────────────────────────────────────────────
networks:
  telebey-network:
    driver: bridge

# ─── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 15 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: telebey_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     telebey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB:       telebey_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - telebey-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telebey -d telebey_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: telebey_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telebey-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # ── NestJS API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
    container_name: telebey_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:           production
      PORT:               ${PORT:-4000}
      DATABASE_URL:       ${DATABASE_URL:-postgresql://telebey:password@postgres:5432/telebey_db}
      REDIS_URL:          ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET:  ${JWT_SECRET:-telebey_access_secret_2026_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-telebey_refresh_secret_2026_change_me}
      BCRYPT_ROUNDS:      ${BCRYPT_ROUNDS:-12}
      OPEN5GS_MONGODB_URI: ${OPEN5GS_MONGODB_URI:-mongodb://mongodb:27017/nextgepc}
      SYLIUS_PUBLIC_KEY_PATH: /app/config/jwt/public.pem
    ports:
      - "${PORT:-4000}:4000"
    networks:
      - telebey-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    volumes:
      - sylius_jwt:/app/config/jwt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── MongoDB for Open5GS ──────────────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: telebey_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    networks:
      - telebey-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Sylius E-commerce ───────────────────────────────────────────────────────
  sylius-db:
    image: mysql:8.0
    container_name: telebey_sylius_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sylius
      MYSQL_USER: sylius
      MYSQL_PASSWORD: sylius
    volumes:
      - sylius_db_data:/var/lib/mysql
    networks:
      - telebey-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  sylius:
    build:
      context: ./apps/sylius
      dockerfile: Dockerfile
    container_name: telebey_sylius
    restart: unless-stopped
    depends_on:
      sylius-db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://sylius:sylius@sylius-db:3306/sylius
      APP_ENV: prod
      APP_SECRET: telebey_sylius_secret_2026
      MAILER_URL: smtp://mailhog:1025
    ports:
      - "8080:80"
    volumes:
      - sylius_media:/var/www/html/public/media
      - sylius_jwt:/var/www/html/config/jwt
    networks:
      - telebey-network
    deploy:
      resources:
        limits:
          memory: 2G
