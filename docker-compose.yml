version: "3.8"

# Telebey ApiGate + isp.router-dashboard (Open5GS WebUI) stack
# Shared MongoDB is the Open5GS subscriber store used by both repos.

services:
  frontend:
    build:
      context: ./telebey-platform/apps/telebey-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend-api
    restart: unless-stopped
    networks:
      - telebey-network

  backend-api:
    build:
      context: ./telebey-platform/apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=telebey_user
      - DB_USER=telebey_user
      - DB_PASSWORD=telebey_pass
      - DB_NAME=telebey_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=dev_access_secret_change_me
      - JWT_REFRESH_SECRET=dev_refresh_secret_change_me
      - OPEN5GS_MONGODB_URI=mongodb://mongo:27017/open5gs
      - OPEN5GS_WEBUI_URL=http://open5gs-webui:9999
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped
    networks:
      - telebey-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=telebey_user
      - POSTGRES_PASSWORD=telebey_pass
      - POSTGRES_DB=telebey_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telebey_user -d telebey_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telebey-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telebey-network

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./integrations/isp-router-dashboard/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - telebey-network

  open5gs-webui:
    build:
      context: https://github.com/TelebeyISP/isp.router-dashboard.git#main
      dockerfile: docker/webui/Dockerfile
    ports:
      - "9999:9999"
    environment:
      - DB_URI=mongodb://mongo/open5gs
      - WAIT_HOSTS=mongo:27017
      - HOSTNAME=0.0.0.0
      - PORT=9999
      - APIGATE_URL=http://backend-api:4000
      - JWT_SECRET_KEY=open5gs_webui_jwt_dev
      - SECRET_KEY=open5gs_webui_session_dev
    volumes:
      - ./integrations/isp-router-dashboard/webui/server/index.js:/usr/src/open5gs/webui/server/index.js:ro
      - ./integrations/isp-router-dashboard/webui/server/routes/apigate.js:/usr/src/open5gs/webui/server/routes/apigate.js:ro
      - ./integrations/isp-router-dashboard/webui/server/routes/index.js:/usr/src/open5gs/webui/server/routes/index.js:ro
    depends_on:
      - mongo
      - backend-api
    restart: unless-stopped
    networks:
      - telebey-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-api
    networks:
      - telebey-network

networks:
  telebey-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
