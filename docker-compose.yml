version: '3.8'

services:
  # Frontend: Next.js App
  frontend:
    build:
      context: ./telebey-platform/apps/telebey-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    depends_on:
      - backend-api
    restart: always
    networks:
      - telebey-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Backend: NestJS API
  backend-api:
    build:
      context: ./telebey-platform/apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=telebey_user
      - DB_PASSWORD=telebey_pass
      - DB_NAME=telebey_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPEN5GS_MONGODB_URI=mongodb://mongo:27017/nextgepc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - telebey-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Database: PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=telebey_user
      - POSTGRES_PASSWORD=telebey_pass
      - POSTGRES_DB=telebey_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telebey_user -d telebey_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telebey-network

  # Cache: Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telebey-network

  # Telecom Core: Open5GS (Scaffolded service)
  open5gs:
    image: open5gs/open5gs:latest
    volumes:
      - ./open5gs/config:/open5gs/install/etc/open5gs
    depends_on:
      - mongo
    networks:
      - telebey-network
    restart: always

  # Open5GS Data: MongoDB
  mongo:
    image: mongo:latest
    volumes:
      - mongodb-data:/data/db
    networks:
      - telebey-network

  # Reverse Proxy: NGINX
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-api
    networks:
      - telebey-network

networks:
  telebey-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
